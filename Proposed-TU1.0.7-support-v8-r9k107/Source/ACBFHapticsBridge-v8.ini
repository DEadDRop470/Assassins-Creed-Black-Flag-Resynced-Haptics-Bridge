[Footsteps]
; ==================== LEFT / RIGHT FOOT CONTACTS ====================
; v8-r9g spatializes Black Flag's real gait-contact events.
; Edward starts a new walking/running animation with the RIGHT foot, so a
; fresh gait sequence always begins Right -> Left -> Right -> Left...
;
; These values affect BOTH native DualSense stereo haptics and conventional
; two-motor rumble. For conventional rumble, "left/right" means the controller's
; left/right motor outputs; those motors may feel physically different.
SpatialFootsteps=1
; RIGHT foot contact: 100% right side, 25% left-side body transfer.
RightFootRightGain=1.00
RightFootLeftGain=0.25
; LEFT foot contact: 100% left side, 25% right-side body transfer.
LeftFootLeftGain=1.00
LeftFootRightGain=0.25
; If no valid gait contact arrives for this long, the next contact restarts as
; RIGHT foot. Changing between walk and fast gait also restarts on RIGHT.
ResetAfterMs=750
; DualSense L3 sprint keeps the continuous run texture and real fast-gait
; contacts are layered on top. r9 uses 0.84 (+20% over r8's 0.70).
; r9f applies [DualSense] LandMovementHapticGain=1.035 on DualSense (+15% vs r9e).
; XInput/GameInput-class land sprint does NOT use the continuous motor bed.
SprintContactOverlayGain=0.84

[Movement]
; v8-r9g ground movement ignores these raw stick thresholds while SemanticEvents=1.
; Real 0xF4919384 and 0xC490DFC6 gait submissions start/maintain walk/jog/run,
; and their cadence sets the run intensity. These thresholds remain only for
; unresolved water movement and legacy SemanticEvents=0 comparison.
WalkThreshold=11000
RunThreshold=24500
SprintToggle=1
SuppressWithStartOrBack=1
WalkEffect=walk_footsteps_sample
RunEffect=run_sustained_sample
; Stable four-contact walk region and six-contact run region from the Shadows
; captures. Each loop phase resets on a walk/run transition.
WalkLoopStartMs=2280
WalkLoopEndMs=3810
; The original 8.59-second Shadows capture goes silent around 5.65 seconds and
; has an irregular tail. Loop only its stable six-step section.
RunLoopStartMs=3100
RunLoopEndMs=4935
; Jog remains event-pulsed. Native DualSense L3 land running uses a continuous
; texture and settles at 1.80x; its first 1.5 seconds use a 2.28x opening.
; XInput/GameInput-class land run is step-pulsed instead of continuous.
; Both are +20% over the r8 1.50 / 1.90 running baseline. r9f raises
; DualSense land walk/jog/L3 run by 15% relative to r9e through
; [DualSense] LandMovementHapticGain=1.035. XInput locomotion is unchanged.
WalkGain=0.65
RunBaseGain=1.80
RunOpeningGain=2.28
RunOpeningDurationMs=1500
; Legacy input sprint kick (SemanticEvents=0). v8 ground gait no longer fires
; this from L3; water-lunge uses its real gameplay Event instead.
SprintKickEffect=parry
SprintKickGain=0.18

[Rumble]
; Conventional-rumble conversion. It preserves the timing and relative
; strength of each Shadows waveform, but a two-motor pad cannot reproduce the
; full stereo 48 kHz detail of a DualSense.
Gain=1.00
MovementGain=2.00
LowMotorScale=3.00
HighMotorScale=1.60
Deadzone=0.008
; r9 FIX: land running on Xbox/XInput/GameInput-class controllers follows the
; same real gait-contact events as walk/jog. 1 disables the old continuous
; land-run motor bed so vibration returns to zero between footsteps.
; Water fast-swim/lunge can still use its continuous texture.
LandRunStepOnly=1
; Strength of each XInput land-run footstep relative to jog. 1.20 = +20%.
SprintStepGain=1.20
 ; r9d XINPUT-ONLY short action envelopes. These cap conventional rumble
; voices and do not change DualSense 48 kHz haptic playback. Jump, landing and
; light attack are each limited to 300 ms.
; If the selected waveform excerpt is already shorter, it naturally ends earlier.
XInputJumpLandingMaxDurationMs=300
XInputLightAttackMaxDurationMs=300
; After one of those impulses ends, command both conventional motors to zero
; for a tiny separation gap. Timelines keep advancing; this is not a gameplay
; cooldown and does not affect DualSense. 0 disables the explicit zero gap.
XInputActionZeroGapMs=16
; Legacy timer-based run pulse mode. Keep 0: r9 now uses REAL gait events.
XInputRunPulseEnabled=0
XInputRunPulseIntervalMs=300
XInputRunPulseDurationMs=75
XInputRunPulseGain=1.00

[Menus]
; Menu-domain detection runs even if Enabled=0 so gameplay effects can never
; leak into a detected menu. Enabled controls only plugin-added menu feedback.
; Start/View opens standard menus. On Sony devices, r5 also reads the raw
; GameInput controller-button view so a DualSense touchpad click immediately
; enters the World/Inventory/Animus domain. r9g caches the raw button layout and,
; once exact semantic menu mode is active, ordinary navigation is owned by Wwise
; events rather than rescanning analog-stick/D-pad direction heuristics. The native
; L1+R1 signature remains a fallback. F10 logs detection and performance diagnostics.
Enabled=1
NativeProbeDelayMs=20
ShoulderNativeProbeDelayMs=20
CloseMovementConfirmMs=80
SessionTimeoutMs=180000
NativeTabArm=1
NativeTabArmWindowMs=2500
NativeTabProbeMs=300
RawTouchpadDetection=1
; DualSense HID button order: Square=0 ... PS=12, Touchpad=13, Mute=14.
; F10 shows count/mask/touch so unusual virtual devices can be diagnosed.
RawTouchpadButtonIndex=13
RawTouchpadSonyOnly=1
; Ordinary QuadAudio sink pointer swaps in menus no longer cancel/reset playback.
; Consumes held menu controls for a few polling frames after a confirmed close,
; preventing a menu press from becoming a gameplay action during a fast switch.
TransitionGuardMs=48
StickThreshold=19000
TickEffect=weapon_transition_short
TickGain=0.35
OpenEffect=dodge
OpenGain=0.28
; Base menu L1/R1 pulse before controller-specific attenuation.
; 0.45 gameplay parry strength * 0.70 = 0.315.
ShoulderGain=0.315
; XInput/Xbox-class menu shoulder pulse remains reduced by 50%.
XInputShoulderGainMultiplier=0.50
; DualSense menu shoulder pulse remains reduced by 25%. This applies to the
; 48 kHz bridge haptic and, when enabled, its parallel conventional-rumble copy.
DualSenseShoulderGainMultiplier=0.75
; r9f: DualSense menu navigation tick is +30% relative to r9e.
; The same multiplier applies to plugin-generated fallback ticks AND to the
; verified Ubisoft-native menu Quad tick on DualSense. XInput menu ticks are unchanged.
