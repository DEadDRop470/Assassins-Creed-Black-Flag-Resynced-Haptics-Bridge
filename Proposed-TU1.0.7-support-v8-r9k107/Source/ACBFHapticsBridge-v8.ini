; Underwater L3/lunge sustained texture hard-stops after this interval. Surface
; swimming L3 remains continuous until the input/state says it ended.
WaterLungeSustainMs=3000
; r9c safety gate: 0x7ED9038C may confirm a lunge only this long after a real
; configured SprintLunge/L3 rising edge. Direction-only copies are ignored.
WaterLungeInputGateMs=600

[NativeArbitration]
; Pause and discard plugin-added output whenever Black Flag is already producing
; native Quad/DualSense haptics, XInput rumble, or GameInput rumble. This avoids
; doubled combat feedback. If native combat haptics are absent, the established
; bridge fallback effects continue to run exactly as before.
Enabled=1
; r9b supplements Ubisoft's own 48 kHz Quad Audio Haptics for the verified
; Edward combat family only: sword light/heavy swings, normal/perfect parry,
; pistol fire, and kick. 1.75 means +75%. Cannon, player-hit, menu, movement,
; water and other native haptics are not intentionally boosted by this feature.
; Native detection/arbitration sees the original unboosted signal first.
CombatNativeBoost=1
CombatNativeHapticGain=1.75
; Short action window armed by the verified combat Wwise event. Repeated combo
; events extend the window. If no native Quad signal appears, nothing is boosted
; and the normal Shadows/bridge fallback behavior is retained.
CombatNativeBoostWindowMs=700
HoldMs=220
ButtonProbeDelayMs=220
HapticPeakThreshold=0.006
HapticMeanThreshold=0.00035
RumbleThreshold=0.015

[Latency]
; Native combat output still gets first refusal. These shorter, action-specific
; probes replace the old blanket 220 ms delay; if native output starts during a
; probe or while an ASI effect is playing, the ASI copy is discarded.
DodgeProbeDelayMs=20
DirectionalDodgeProbeDelayMs=20
ParryProbeDelayMs=24
AttackProbeDelayMs=60
DPadLeftProbeDelayMs=0
; Playback offsets are measured from the Shadows captures. The 197/236 ms
; dodge offsets are respectively 25%/30% of the full 787.8 ms clip. The parry
; offset removes its 48 ms quiet onset without changing the impact itself.
DodgeStartTrimMs=197
DirectionalDodgeStartTrimMs=236
ParryStartTrimMs=48
DirectionalDodgeStickThreshold=4500

[Recovery]
; Wwise can recreate the Quad Audio Haptics sink after death, manual load, or
; a long loading transition. r5 automatically adopts the replacement sink and
; clears stale actor/menu/playback state when audio resumes.
SinkRebindAfterMs=750
ReloadSilenceResetMs=1500

[Hook]
; Exact ACBlackFlag.exe SHA-256 target:
; 614dab4a20a5d5c6256792e1daa6d05669c97a751079b10df1725d6965ad766d
; Steam TU 1.0.7, file size 469524824 bytes.
; AkQuadAudioHapticsSink frame-final flush. The ASI verifies the 16-byte
; prologue before patching and leaves this site untouched on a mismatch.
; The full 16-byte 1.0.6 prologue (48 89 5C 24 18 55 56 57 48 83 EC 20
; 0F B7 79 42) matches exactly once in the 1.0.7 executable, at this RVA.
; Steam TU 1.0.6 (SHA-256 8d522381..., 478845280 bytes) used 0x04F78610.
QuadHapticsFlushRVA=0x05028310
MaxFrames=4096
; Wwise PostEvent producer used by the semantic router. Steam TU 1.0.6 used
; 0x0091DEA0. The 1.0.7 value below was derived by byte-diffing the two
; executables: unique fuzzy match, 96.2% of the first 160 bytes identical with
; only 2 mismatch runs (RIP-relative displacements); the next-best candidate
; scored 23%. The prologue signature is still verified before patching.
PostEventRVA=0x0091D950

[Input]
; Press threshold used when any action is bound to L2/LT or R2/RT.
TriggerThreshold=160

[Buttons]
; Advanced waveform-name slots. Values here must name effects in the HFX pack;
; controller names belong in [InputBindings]. The legacy slot names remain for
; INI compatibility: BEffect backs DodgeDive, LBEffect backs Parry, RBEffect
; backs Attack, and DPadLeftEffect backs SheatheHood even after those actions
; are remapped.
; AEffect remains blank because the InputBindings Jump action is contextual:
; land jump, directional climb jump, or soft water/swim-up. Verified animation
; states correct landing time and cancel invalid water/climb/haystack landings.
; AEffect is only the optional legacy path when InputJumpFallback=0.
AEffect=
BEffect=dodge
; X/Y, other D-pad, and trigger slots are optional RAW physical-input mappings.
; They are blank to prevent context false positives. Setting one can add a
; second effect when the same physical input is also used in [InputBindings].
XEffect=
YEffect=
LBEffect=parry
; The captured parry has a 0.812 peak and was too strong at unity gain.
LBEffectGain=0.45
; A short Attack tap plays the normal attack after release. Holding Attack for
; 320 ms commits two softened parry impacts; canonical r7 delay is 590 ms.
; Both timings are 20% shorter than r3; their 48 ms waveform lead-in is also
; removed by the Latency section.
; This is tuned for the cutlass test, but applies to every Attack hold until the
; bridge gains a reliable equipped-weapon state hook.
RBEffect=light_attack_single
RBEffectGain=1.00
RBHoldEffect=parry
RBHoldGain=0.45
RBHoldThresholdMs=320
RBHoldSecondDelayMs=590
DPadUpEffect=
DPadDownEffect=
; SheatheHood fires on its press edge with no ASI delay: it covers Toggle Hood
; and hold-based Sheathe/Unsheathe. In menu mode, navigation is consumed first.
DPadLeftEffect=weapon_sheathe_unsheathe_full
DPadRightEffect=
; These raw trigger slots remain blank until a reliable Character/Ship context
; source is hooked. L2/R2 can still be used as semantic action bindings above.
LeftTriggerEffect=
RightTriggerEffect=
