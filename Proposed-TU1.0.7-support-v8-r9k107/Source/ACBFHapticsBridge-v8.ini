[GameplayState]
; Black Flag gameplay-state callbacks used for Jump/InAir, falling, climbing,
; swimming, shallow water and haystack transitions.
; The v8-r9k107 ASI carries dual slot/function tables (Steam TU 1.0.6 and
; TU 1.0.7) and picks whichever pair verifies fail-closed at runtime.
Enabled=1
BindWindowMs=900
RebindAfterIdleMs=15000
; While Cross/A is HELD, v8-r9g keeps this player-correlation evidence alive across
; automatic parkour/vault transitions instead of requiring a new button press each time.
JumpInputWindowMs=1000
SwimInputWindowMs=4000
; r7 FIX: walking/running straight into water can make Black Flag automatically hop
; into Swimming without the player pressing Cross/A or Circle/B. A verified real
; Swimming/ShallowWater transition can now reacquire Edward from recent movement.
; 1 = enabled (recommended). This does NOT create water mode from stick input alone.
AutoWaterEntryReacquire=1
; Minimum left-stick movement used as supporting evidence for automatic water entry.
AutoWaterMovementThreshold=4500
; How recently a real Edward gait/gameplay event must have occurred on first entry.
AutoWaterEvidenceWindowMs=2500
ClimbJumpStickThreshold=4500
; If an airborne callback follows a climb exit, include the climb-exit time in airtime.
ClimbAirCarryMs=750
; Parkour landing strength uses AIRTIME plus an estimated horizontal-distance score.
