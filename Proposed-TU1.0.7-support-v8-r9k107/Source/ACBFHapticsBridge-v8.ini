; ============================================================================
; ACBFHapticsBridge v8-r9k / v2.3.7.3
; USER GUIDE
; 1) Overall strength: [Playback] MasterGain
; 2) Short action strength: [Playback] OneShotGain
; 3) Walk/run only: [Playback] MovementGain and [Effect.Walk]/[Movement]
; 4) One specific action: its [Effect.*] IntensityMultiplier
; 5) Controller remaps: [InputBindings]
; 6) Parkour landing scaling: [GameplayState] ParkourDistance*
; 7) Left/right footsteps: [Footsteps]
; 8) DualSense bridge cleanup: [DualSense] and [Menus]
; 9) XInput-only action duration caps: [Rumble]
; Restart Black Flag after editing this file.
; ============================================================================

[General]
; ACBFHapticsBridge v8-r9h / Nexus v2.3.7.0.
; F11 toggles the complete bridge. F10 writes runtime diagnostics.
; F12 now suspends controller polling/raw-input processing for diagnostics; semantic/state/native routing stays active.
Enabled=1
InputBridge=1
ControllerIndex=0
; 2 ms = 500 Hz bridge-side controller sampling. This does not overclock the
; controller itself: a 250 Hz USB report source still supplies fresh data about
; every 4 ms, while the worker is ready to consume it within the next 2 ms slot.
PollMs=2
; Expensive GameInput identity/metadata is cached instead of queried at 500 Hz.
GameInputDeviceRefreshMs=125
GameInputStatusRefreshMs=500
; Conventional motor state updates are capped at 250 Hz while start/stop stays immediate.
RumbleWriteIntervalMs=4

[Playback]
; ==================== MAIN USER STRENGTH CONTROLS ====================
; v2.3.6 keeps the normalized scale: shipped 1.00 values are the tuned baseline.
; NormalizedBaseline=1 means:
;   MasterGain 1.00 = 2.50x the old pre-hotfix raw master strength.
;   OneShotGain 1.00 = 1.80x the old pre-hotfix one-shot strength.
; This same master baseline is used by DualSense haptics AND conventional rumble,
; whether the controller is read through GameInput or XInput.
; Examples: 0.80 = 20% weaker than v2.3.4 default; 1.20 = 20% stronger.
; Keep NormalizedBaseline=1 unless you intentionally want legacy raw gain numbers.
NormalizedBaseline=1
MasterGain=0.90
; Extra multiplier for continuous movement (walk/run/swim textures).
MovementGain=1.00
; Extra multiplier for short effects: jump, landing, combat, water, menus, etc.
OneShotGain=1.00
; Output limiter. 0 disables limiting; 2.00 is the recommended default.
PeakLimit=2.00
MovementFadeMs=35

[Output]
; Full 48 kHz stereo Shadows waveforms mixed into Black Flag's native Wwise
; Quad Audio Haptics sink. DSX can forward this stream over Bluetooth through
; its Virtual DualSense with Audio device.
NativeHaptics=1
; Derive ordinary low/high-motor vibration from the same waveform timeline.
; This covers Xbox/XInput pads, emulated XInput pads, native HID pads supported
; by GameInput, and (by default) the DualSense rumble layer too.
; For non-DualSense devices v8-r9g mirrors the motor state through XInput as well,
; because some virtual Xbox 360 devices accept input via GameInput but ignore
; GameInput's void-returning rumble call.
ConventionalRumble=1
PreferGameInput=1
RumbleOnDualSense=1
; r9k: Ubisoft Connect / Ubisoft+ only. Steam and voices38 stay on the exact
; v2.3.7.0/r9h native Quad haptic path and never use this direct renderer.
; On verified Ubisoft profiles the 48 kHz / 4-channel DualSense endpoint is
; only a fallback when meaningful Ubisoft-native Quad haptics are absent.
UbisoftDirectDualSenseFallback=1
UbisoftDirectDualSenseFallbackDelayMs=1000

[DualSense]
; ==================== DUALSENSE BRIDGE CLEANUP ====================
; These multipliers affect ACBFHapticsBridge output only. Ubisoft-native Quad
; haptics are NOT reduced here; the existing native combat supplement remains
; independent. With RumbleOnDualSense=1, the same category cleanup is also
; applied to the bridge's parallel conventional-rumble copy on DualSense.
; Haptics do NOT overflow into rumble when they get strong: the two paths are
; parallel, and [Playback] PeakLimit caps the 48 kHz haptic stream.
; Global release cleanup: -10% to all bridge feedback on DualSense.
BridgeHapticGain=0.90
; Additional -15% for jump and ground-landing bridge feedback. Combined with
; BridgeHapticGain, these actions are 0.90 * 0.85 = 0.765 of the r9d level.
JumpLandingHapticGain=0.85
; r9f raises LAND walk/jog/L3-run intensity by 15% relative to r9e.
; r9e used 0.90 here, so 0.90 * 1.15 = 1.035. With the retained global
; BridgeHapticGain=0.90, land locomotion is 0.9315 of the old r9d level.
; Water movement receives the global 0.90 only.
LandMovementHapticGain=1.035

[InputBindings]
; v8-r9g NOTE: confirmed semantic actions ignore these raw bindings when
; [SemanticEvents] Enabled=1. They remain for unresolved context fallbacks and
; for disabling SemanticEvents during comparison tests.
; Match these six action bindings to Black Flag's in-game controller remap.
; The ASI cannot safely read the game's saved remap table automatically, so
; edit this section and restart the game after changing controls.
;
; Accepted values (case-insensitive; spaces, - and _ are ignored):
;   Cross or A       = bottom face button
;   Circle or B      = right face button
;   Square or X      = left face button
;   Triangle or Y    = top face button
;   L1 or LB         = left shoulder       R1 or RB = right shoulder
;   L2 or LT         = left trigger        R2 or RT = right trigger
;   L3 or LS         = left-stick click    R3 or RS = right-stick click
;   DPadUp, DPadDown, DPadLeft, DPadRight
;   None             = no direct input (use Effect.* Enabled=0 to disable an
;                      effect completely; state-only effects can still run)
;
; IMPORTANT: write Cross for the PlayStation X/cross button. The value X means
; the Xbox X / PlayStation Square button. Touchpad, PS/Guide, paddles, keyboard,
; stick directions, Options/Start, and Share/Create/View are not action-binding
; values. Menu opening/navigation remains handled separately by [Menus].
;
; Ground Jump/Landing is authoritative from Black Flag's gameplay Jump/InAir
; state hooks again in r6 (the old airtime path). This binding remains for
; climb-jump/swim-up context and state-correlation diagnostics.
Jump=Cross
; Ground dodge/roll is exact-event driven (one real Event per roll). Circle is
; retained only for water/air dive fallback until that family is fully mapped.
DodgeDive=Circle
; Perfect parry stays native-only. Normal parry uses the exact event plus a
; 24 ms native-first fallback, so out-of-combat L1 still has feedback.
Parry=L1
; First-stage light/heavy attacks use exact events. Native combat haptics win.
; r6 also watches R1 press/release edges to fill unmapped combo #2/#3/#4 gaps;
; a semantic/native event for that press suppresses the hybrid copy.
Attack=R1
; Walk/jog cadence is event-driven. L3 explicitly arms continuous land RUN: a
; 1.5 s high opening then 50%-stronger sustain. In water, surface sprint can
; sustain continuously. Underwater, the lunge effect is authorized ONLY by
; a real L3 rising edge; the 0x7ED9038C Wwise event is confirmation only because
; ordinary direction changes can emit it too. The accepted lunge is capped to 3 s.
SprintLunge=L3
; Sheathe, unsheathe, Hood ON and Hood OFF are exact-event driven.
SheatheHood=DPadLeft

; ---------------------------------------------------------------------------
; PER-EFFECT CONTROLS (recommended user tuning area)
; ---------------------------------------------------------------------------
; v8-r7 preserves the tuned effect strengths and
; timing by default. Changes are loaded when the game starts; restart the game
; after editing this file.
;
; Enabled: 1 = on, 0 = off for that automatic gameplay/menu effect.
; IntensityMultiplier: multiplies the calibrated r7 strength on BOTH native
; DualSense haptics and conventional rumble. Examples: 0.50 = half strength,
; 1.25 = 25% stronger, 2.00 = double. Valid range is 0.00-4.00.
; TriggerOffsetMs: signed delay added to the calibrated event delay. Negative
; values make feedback earlier (never earlier than the detected input/state);
; positive values make it later. Valid range is -5000 to +5000.
; StartTrimOffsetMs: signed playback-position adjustment. Positive values skip
; more of the waveform beginning for a faster impact; negative values restore
; more of its original lead-in. This never changes game or animation speed.
;
; Runtime keys: F9 previews Dodge, F10 writes full v8 semantic/state status,
; F11 toggles the whole mod with a full state reload on re-enable, and F12
; remains a developer toggle for unresolved input-fallback mappings.

[Files]
; Keep the pack beside the ASI unless you provide another path here.
HapticsPack=.\ShadowsHapticsPack-v5.hfx

