[General]
; ACBFHapticsBridge v8-r4 hybrid state/combo/run/water revision.
; F11 toggles the complete mod. Re-enabling performs a full runtime state reload:
; semantic game/menu domain, gait, airtime, actor/state caches and stale playback
; are cleared and reconstructed from the next real Black Flag events.
Enabled=1
; InputBridge is now fallback-only for unresolved actions (water dive/swim-up,
; climb jump, menu-open/shoulder tabs and legacy comparison). Confirmed ground
; actions below are driven by exact Wwise gameplay events instead.
InputBridge=1
ControllerIndex=0
PollMs=8

[SemanticEvents]
; Exact Wwise PostEvent-by-ID hook at verified RVA 0x0091DEA0.
Enabled=1
; Real menu events own menu state and ordinary navigation ticks.
MenuState=1
; r4 walk/jog remain per-event. L3 land sprint is continuous; 450 ms is only
; a lost-gait safety timeout. Releasing the stick stops the run immediately.
GaitTimeoutMs=450
; Light/heavy swings keep a tiny 32 ms Ubisoft-native first-refusal window.
; Later R1 combo taps that lack the mapped first-stage Event use a hybrid
; controller-edge fallback so every accepted tap can still produce feedback.
AttackNativeProbeMs=32
; Confirmed missing-native actions are immediate in r4.
OneShotNativeProbeMs=0
LandingNativeProbeMs=0
; Legacy semantic-air safety diagnostic. r4 gameplay Jump/InAir hooks are
; authoritative for takeoff/landing, so normal jumps no longer depend on this.
AirTimeoutMs=6500

; One real Ubisoft gait Event now produces one short Shadows foot-contact pulse.
; These offsets select the strongest clean contact inside the captured source.
WalkPulseStartMs=2440
WalkPulseDurationMs=150
RunPulseStartMs=3120
RunPulseDurationMs=140

; Playback caps remove long post-animation tails from the original captures.
DodgePulseDurationMs=330
LightAttackDurationMs=360
HeavyAttackDurationMs=520
JumpPulseDurationMs=260
LandingPulseDurationMs=260
KickPulseDurationMs=320
WaterLungeDurationMs=330
SurfaceDurationMs=220

; r4 heavy attack: two compact excerpts from heavy_r2. The opening is stronger
; and the second impact is pulled forward instead of inheriting Shadows' long gap.
HeavyPhase1StartMs=120
HeavyPhase1DurationMs=180
HeavyPhase2DelayMs=100
HeavyPhase2StartMs=235
HeavyPhase2DurationMs=190

; r4 sheathe/unsheathe: preserve the opening, then replay the strong ~0.9 s
; source region at 0.62 s, about 30% earlier than the original capture timing.
SheathePhase1DurationMs=180
SheathePhase2DelayMs=620
SheathePhase2StartMs=900
SheathePhase2DurationMs=360

; Underwater L3/lunge sustained texture hard-stops after this interval. Surface
; swimming L3 remains continuous until the input/state says it ended.
WaterLungeSustainMs=3000

[Output]
; Full 48 kHz stereo Shadows waveforms mixed into Black Flag's native Wwise
; Quad Audio Haptics sink. DSX can forward this stream over Bluetooth through
; its Virtual DualSense with Audio device.
NativeHaptics=1
; Derive ordinary low/high-motor vibration from the same waveform timeline.
; This covers Xbox/XInput pads, emulated XInput pads, native HID pads supported
; by GameInput, and (by default) the DualSense rumble layer too.
; For non-DualSense devices v6 mirrors the motor state through XInput as well,
; because some virtual Xbox 360 devices accept input via GameInput but ignore
; GameInput's void-returning rumble call.
ConventionalRumble=1
PreferGameInput=1
RumbleOnDualSense=1

[Files]
; Keep the pack beside the ASI unless you provide another path here.
HapticsPack=.\ShadowsHapticsPack-v5.hfx

[InputBindings]
; v8 NOTE: confirmed semantic actions ignore these raw bindings when
; [SemanticEvents] Enabled=1. They remain for unresolved context fallbacks and
; for disabling SemanticEvents during comparison tests.
; Match these six action bindings to Black Flag's in-game controller remap.
; The ASI cannot safely read the game's saved remap table automatically, so
; edit this section and restart the game after changing controls.
;
; Accepted values (case-insensitive; spaces, - and _ are ignored):
;   Cross or A       = bottom face button
;   Circle or B      = right face button
;   Square or X      = left face button
;   Triangle or Y    = top face button
;   L1 or LB         = left shoulder       R1 or RB = right shoulder
;   L2 or LT         = left trigger        R2 or RT = right trigger
;   L3 or LS         = left-stick click    R3 or RS = right-stick click
;   DPadUp, DPadDown, DPadLeft, DPadRight
;   None             = no direct input (use Effect.* Enabled=0 to disable an
;                      effect completely; state-only effects can still run)
;
; IMPORTANT: write Cross for the PlayStation X/cross button. The value X means
; the Xbox X / PlayStation Square button. Touchpad, PS/Guide, paddles, keyboard,
; stick directions, Options/Start, and Share/Create/View are not action-binding
; values. Menu opening/navigation remains handled separately by [Menus].
;
; Ground Jump/Landing is authoritative from Black Flag's gameplay Jump/InAir
; state hooks again in r4 (the old airtime path). This binding remains for
; climb-jump/swim-up context and state-correlation diagnostics.
Jump=Cross
; Ground dodge/roll is exact-event driven (one real Event per roll). Circle is
; retained only for water/air dive fallback until that family is fully mapped.
DodgeDive=Circle
; Perfect parry stays native-only. Normal parry uses the exact event plus a
; 24 ms native-first fallback, so out-of-combat L1 still has feedback.
Parry=L1
; First-stage light/heavy attacks use exact events. Native combat haptics win.
; r4 also watches R1 press/release edges to fill unmapped combo #2/#3/#4 gaps;
; a semantic/native event for that press suppresses the hybrid copy.
Attack=R1
; Walk/jog cadence is event-driven. L3 explicitly arms continuous land RUN: a
; 1.5 s high opening then 50%-stronger sustain. In water, surface sprint can
; sustain continuously; an underwater lunge is capped to 3 seconds.
SprintLunge=L3
; Sheathe, unsheathe, Hood ON and Hood OFF are exact-event driven.
SheatheHood=DPadLeft

; ---------------------------------------------------------------------------
; PER-EFFECT CONTROLS (recommended user tuning area)
; ---------------------------------------------------------------------------
; v8 preserves the tested r6/r7 effect strengths and
; timing by default. Changes are loaded when the game starts; restart the game
; after editing this file.
;
; Enabled: 1 = on, 0 = off for that automatic gameplay/menu effect.
; IntensityMultiplier: multiplies the calibrated r4 strength on BOTH native
; DualSense haptics and conventional rumble. Examples: 0.50 = half strength,
; 1.25 = 25% stronger, 2.00 = double. Valid range is 0.00-4.00.
; TriggerOffsetMs: signed delay added to the calibrated event delay. Negative
; values make feedback earlier (never earlier than the detected input/state);
; positive values make it later. Valid range is -5000 to +5000.
; StartTrimOffsetMs: signed playback-position adjustment. Positive values skip
; more of the waveform beginning for a faster impact; negative values restore
; more of its original lead-in. This never changes game or animation speed.
;
; Runtime keys: F9 previews Dodge, F10 writes full v8 semantic/state status,
; F11 toggles the whole mod with a full state reload on re-enable, and F12
; remains a developer toggle for unresolved input-fallback mappings.

[Effect.Walk]
Enabled=1
; Calibrated r4 walk strength is 0.65 before this multiplier.
IntensityMultiplier=1.00
; Native 48 kHz DualSense haptic path only. v7-r7 tuning is preserved at 4.00;
; this does not change conventional Xbox/DS4 rumble or the running texture.
DualSenseHapticMultiplier=4.00
; Loop timing follows the captured Shadows gait contacts.
LoopStartMs=2280
LoopEndMs=3810
FadeMs=35

[Effect.Run]
Enabled=1
; L3 run uses the Movement gains: 1.90 opening for 1.5 s, then 1.50 sustain.
IntensityMultiplier=1.00
LoopStartMs=3100
LoopEndMs=4935
OpeningDurationMs=1500
FadeMs=35

[Effect.SprintKick]
Enabled=1
; Calibrated strength 0.18; base trigger/trim timing is 20/48 ms.
IntensityMultiplier=1.00
TriggerOffsetMs=0
StartTrimOffsetMs=0

[Effect.Jump]
