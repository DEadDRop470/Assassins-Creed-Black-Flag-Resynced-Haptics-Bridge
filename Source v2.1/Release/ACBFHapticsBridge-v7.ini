[Hook]
; Exact ACBlackFlag.exe SHA-256 target:
; 8d52238155c9491f329c0b78af2d00ee67ab5e03946eea83e12b061b64b23140
; Steam TU 1.0.6, file size 478845280 bytes.
; AkQuadAudioHapticsSink frame-final flush. The ASI verifies the 16-byte
; prologue before patching and leaves this site untouched on a mismatch.
QuadHapticsFlushRVA=0x04F78610
MaxFrames=4096

[GameplayState]
; 21 exact vtable slots from the fingerprinted executable expose InAir, real
; jump, fall-from-ledge, haystack, climb, full-swim, and shallow-swim
; transitions. Every slot is checked before it is changed.
Enabled=1
; Jump/DodgeDive input identifies Edward's actor context. The hybrid binder may replace a
; stale binding when a real Jump or Swimming-entry callback correlates
; with the input; this addresses the supplied r3 log's 3/21 accepted jumps and
; 0/3 accepted swim transitions.
BindWindowMs=900
RebindAfterIdleMs=15000
; A real JumpOnSpot/FreeJump/TargetedJump must correlate with Jump in this
; window. While climbing it must also have directional left-stick input.
JumpInputWindowMs=1000
; Water entry can occur well after an airborne DodgeDive/Jump request. This
; wider window lets Swimming-entry rebind Edward without delaying splash.
SwimInputWindowMs=4000
ClimbJumpStickThreshold=4500
; Reject unconfirmed state noise shorter than this. A verified jump overrides
; the cutoff, so short/in-place jumps still receive both takeoff and landing.
; Landings are timed from actual airborne entry/exit, then delayed 32 ms so the
; InAir and FallFromLedge states can settle.
MinimumAirborneMs=120
LandingConfirmDelayMs=32
SurfaceConfirmDelayMs=140
; The Jump binding supplies an immediate provisional takeoff on land and
; directional climbing jumps. A verified Air exit replaces fallback timing;
; if the exit hook is missed, a ground-safe fallback fires after 2 seconds.
; Water/Climb/Haystack state cancels that fallback. A stale AIR latch alone is
; recovered after the timeout without expiring persistent swim/climb state.
InputJumpFallback=1
InputLandingFallbackMs=2000
InputLandingTimeoutMs=8000
; The reused dodge capture has ~236 ms of quiet lead-in. State-driven impacts
; start at that later frame instead of adding visible animation lag.
EffectStartTrimMs=236
; State events retain a very short native-output probe.
NativeProbeDelayMs=20
; The current Shadows capture has no isolated jump/landing/splash clips, so
; these state-correct events reuse its dodge waveform as a temporary texture.
JumpEffect=dodge
JumpGain=0.55
LandingEffect=dodge
; Air-time strength curve: <=0.9 s is soft, 0.9-2.5 s interpolates to normal,
; 2.5-6.0 s interpolates to long-fall strength, and >=6.0 s is capped.
LandingShortAirMs=900
LandingLongAirMs=2500
LandingMaxAirMs=6000
LandingShortGain=0.55
LandingGain=0.70
LandingLongGain=1.00
; A dedicated HayStack state suppresses the hard ground landing and emits this
; softer leap-of-faith texture, still scaled by measured airborne time.
HaystackEffect=dodge
HaystackGain=0.42
DiveEffect=dodge
DiveGain=1.00
SurfaceEffect=dodge
SurfaceGain=0.45
; Jump while swimming is a soft upward-water impulse. SprintLunge in water is
; a large initial lunge followed by sustained fast-swim texture.
WaterJumpEffect=dodge
WaterJumpGain=0.65
WaterLungeEffect=dodge
WaterLungeGain=1.20

[NativeArbitration]
; Pause and discard plugin-added output whenever Black Flag is already producing
; native Quad/DualSense haptics, XInput rumble, or GameInput rumble. This avoids
; doubled sword-swing, clash, and parry feedback without cancelling game output.
Enabled=1
HoldMs=220
ButtonProbeDelayMs=220
HapticPeakThreshold=0.006
HapticMeanThreshold=0.00035
RumbleThreshold=0.015

[Latency]
; Native combat output still gets first refusal. These shorter, action-specific
; probes replace the old blanket 220 ms delay; if native output starts during a
; probe or while an ASI effect is playing, the ASI copy is discarded.
DodgeProbeDelayMs=20
DirectionalDodgeProbeDelayMs=20
ParryProbeDelayMs=60
AttackProbeDelayMs=60
DPadLeftProbeDelayMs=0
; Playback offsets are measured from the Shadows captures. The 197/236 ms
; dodge offsets are respectively 25%/30% of the full 787.8 ms clip. The parry
; offset removes its 48 ms quiet onset without changing the impact itself.
DodgeStartTrimMs=197
DirectionalDodgeStartTrimMs=236
ParryStartTrimMs=48
DirectionalDodgeStickThreshold=4500

[Menus]
; Menu-domain detection runs even if Enabled=0 so gameplay effects can never
; leak into a detected menu. Enabled controls only plugin-added menu feedback.
; Start/View opens standard menus. On Sony devices, r5 also reads the raw
; GameInput controller-button view so a DualSense touchpad click immediately
; enters the World/Inventory/Animus domain. The native L1+R1 signature remains
; a fallback. F10 logs all detection paths and raw button diagnostics.
Enabled=1
NativeProbeDelayMs=20
ShoulderNativeProbeDelayMs=20
CloseMovementConfirmMs=80
SessionTimeoutMs=180000
NativeTabArm=1
NativeTabArmWindowMs=2500
NativeTabProbeMs=300
RawTouchpadDetection=1
; DualSense HID button order: Square=0 ... PS=12, Touchpad=13, Mute=14.
; F10 shows count/mask/touch so unusual virtual devices can be diagnosed.
RawTouchpadButtonIndex=13
RawTouchpadSonyOnly=1
; Consumes held menu controls for a few polling frames after a confirmed close,
; preventing a menu press from becoming a gameplay action during a fast switch.
TransitionGuardMs=48
StickThreshold=19000
TickEffect=weapon_transition_short
TickGain=0.35
OpenEffect=dodge
OpenGain=0.28
; 0.45 gameplay parry strength * 0.70 = 0.315.
ShoulderGain=0.315

[Recovery]
; Wwise can recreate the Quad Audio Haptics sink after death, manual load, or
; a long loading transition. r5 automatically adopts the replacement sink and
; clears stale actor/menu/playback state when audio resumes.
SinkRebindAfterMs=750
ReloadSilenceResetMs=1500

[Playback]
; The captured samples are already at their original rendered amplitudes.
MasterGain=1.00
MovementGain=1.00
OneShotGain=1.00
; 0 disables limiting. 2.0 preserves the strongest captured environment mix
; while preventing pathological overlap from growing without bound.
PeakLimit=2.00
MovementFadeMs=35

[Rumble]
; Conventional-rumble conversion. It preserves the timing and relative
; strength of each Shadows waveform, but a two-motor pad cannot reproduce the
; full stereo 48 kHz detail of a DualSense.
Gain=1.00
MovementGain=2.00
LowMotorScale=3.00
HighMotorScale=1.60
Deadzone=0.008
; Direct XInput and Microsoft/DSX Xbox-class devices replace the continuous
; running motor envelope with one capture-peak contact every 300 ms. Each
; pulse lasts 75 ms, leaving a 225 ms quiet gap. The first-five-second 20%
; run boost and later settled level remain intact. Native Sony GameInput
; devices retain the continuous haptic texture.
XInputRunPulseEnabled=1
XInputRunPulseIntervalMs=300
XInputRunPulseDurationMs=75
XInputRunPulseGain=1.00

[Movement]
; Walking requires left-stick magnitude >= WalkThreshold. The run loop requires
; the configured SprintLunge input plus >= RunThreshold movement. The supplied
; layout uses an L3 press, so toggle behavior is the default. Set SprintToggle=0
; if your in-game Sprint/Lunge action requires holding its configured input.
WalkThreshold=11000
RunThreshold=24500
SprintToggle=1
SuppressWithStartOrBack=1
WalkEffect=walk_footsteps_sample
RunEffect=run_sustained_sample
; Stable four-contact walk region and six-contact run region from the Shadows
; captures. Each loop phase resets on a walk/run transition.
WalkLoopStartMs=2280
WalkLoopEndMs=3810
; The original 8.59-second Shadows capture goes silent around 5.65 seconds and
; has an irregular tail. Loop only its stable six-step section.
RunLoopStartMs=3100
RunLoopEndMs=4935
; Walking stays soft. Running is 25% stronger than the r2 baseline on every
; output backend. Its first five seconds add another 20%, then settle to 1.25.
WalkGain=0.65
RunBaseGain=1.25
RunOpeningGain=1.50
RunOpeningDurationMs=5000
; A gentle parry-derived kick is overlaid when SprintLunge starts a sprint.
; This also supplies the requested sprint/swim acceleration impact.
SprintKickEffect=parry
SprintKickGain=0.18

[Input]
; Press threshold used when any action is bound to L2/LT or R2/RT.
TriggerThreshold=160

[Buttons]
; Advanced waveform-name slots. Values here must name effects in the HFX pack;
; controller names belong in [InputBindings]. The legacy slot names remain for
; INI compatibility: BEffect backs DodgeDive, LBEffect backs Parry, RBEffect
; backs Attack, and DPadLeftEffect backs SheatheHood even after those actions
; are remapped.
; AEffect remains blank because the InputBindings Jump action is contextual:
; land jump, directional climb jump, or soft water/swim-up. Verified animation
; states correct landing time and cancel invalid water/climb/haystack landings.
; AEffect is only the optional legacy path when InputJumpFallback=0.
AEffect=
BEffect=dodge
; X/Y, other D-pad, and trigger slots are optional RAW physical-input mappings.
; r7 reserves XEffect for the gameplay R2+Square kick. The binary requires R2
; to be held before the Square press reaches XEffect, preventing Square-only
; false positives. Other raw slots remain optional advanced mappings.
XEffect=parry
; r7 binary-gates this raw Square/X slot: it fires only on a Square press edge
; while R2 is already held above [Input] TriggerThreshold. Its gain is taken
; from LBEffectGain so the kick matches the normal parry impact strength.
YEffect=
LBEffect=parry
; The captured parry has a 0.812 peak and was too strong at unity gain.
LBEffectGain=0.45
; A short Attack tap plays the normal attack after release. Holding Attack for
; 320 ms commits two softened parry impacts 640 ms start-to-start.
; Both timings are 20% shorter than r3; their 48 ms waveform lead-in is also
; removed by the Latency section.
; This is tuned for the cutlass test, but applies to every Attack hold until the
; bridge gains a reliable equipped-weapon state hook.
RBEffect=light_attack_single
RBEffectGain=1.00
RBHoldEffect=parry
RBHoldGain=0.45
RBHoldThresholdMs=320
RBHoldSecondDelayMs=640
DPadUpEffect=
DPadDownEffect=
; SheatheHood fires on its press edge with no ASI delay: it covers Toggle Hood
; and hold-based Sheathe/Unsheathe. In menu mode, navigation is consumed first.
DPadLeftEffect=weapon_sheathe_unsheathe_full
DPadRightEffect=
; These raw trigger slots remain blank until a reliable Character/Ship context
; source is hooked. L2/R2 can still be used as semantic action bindings above.
LeftTriggerEffect=
RightTriggerEffect=
