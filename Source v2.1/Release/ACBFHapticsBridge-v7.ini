[General]
; Master enable. F11 toggles the complete mod at runtime.
Enabled=1
; Controller input drives mappings and arms player-state correlation. GameInput
; is tried first, then XInput. F12 toggles only this automatic input/state
; layer for native-vs-mod comparison; the ASI stays loaded and F9 still works.
InputBridge=1
ControllerIndex=0
PollMs=8

[Output]
; Full 48 kHz stereo Shadows waveforms mixed into Black Flag's native Wwise
; Quad Audio Haptics sink. DSX can forward this stream over Bluetooth through
; its Virtual DualSense with Audio device.
NativeHaptics=1
; Derive ordinary low/high-motor vibration from the same waveform timeline.
; This covers Xbox/XInput pads, emulated XInput pads, native HID pads supported
; by GameInput, and (by default) the DualSense rumble layer too.
; For non-DualSense devices v6 mirrors the motor state through XInput as well,
; because some virtual Xbox 360 devices accept input via GameInput but ignore
; GameInput's void-returning rumble call.
ConventionalRumble=1
PreferGameInput=1
RumbleOnDualSense=1

[Files]
; Keep the pack beside the ASI unless you provide another path here.
HapticsPack=.\ShadowsHapticsPack-v5.hfx

[InputBindings]
; Match these six action bindings to Black Flag's in-game controller remap.
; The ASI cannot safely read the game's saved remap table automatically, so
; edit this section and restart the game after changing controls.
;
; Accepted values (case-insensitive; spaces, - and _ are ignored):
;   Cross or A       = bottom face button
;   Circle or B      = right face button
;   Square or X      = left face button
;   Triangle or Y    = top face button
;   L1 or LB         = left shoulder       R1 or RB = right shoulder
;   L2 or LT         = left trigger        R2 or RT = right trigger
;   L3 or LS         = left-stick click    R3 or RS = right-stick click
;   DPadUp, DPadDown, DPadLeft, DPadRight
;   None             = no direct input (use Effect.* Enabled=0 to disable an
;                      effect completely; state-only effects can still run)
;
; IMPORTANT: write Cross for the PlayStation X/cross button. The value X means
; the Xbox X / PlayStation Square button. Touchpad, PS/Guide, paddles, keyboard,
; stick directions, Options/Start, and Share/Create/View are not action-binding
; values. Menu opening/navigation remains handled separately by [Menus].
;
; Jump drives provisional ground/climb takeoff, swim-up, Jump-state actor
; correlation, and the guarded landing cycle.
Jump=Cross
; DodgeDive drives land dodge/roll, airborne dive arming, water dive, and
; Swimming-entry actor correlation.
DodgeDive=Circle
; Parry drives only the low-latency fallback; native combat feedback wins.
Parry=L1
; Attack drives tap/release light attack and held two-stage heavy fallback.
Attack=R1
; SprintLunge drives the sprint latch/start kick and water lunge/fast-swim.
SprintLunge=L3
; SheatheHood starts the shared hood/sheathe waveform on the press edge.
SheatheHood=DPadLeft

; ---------------------------------------------------------------------------
; PER-EFFECT CONTROLS (recommended user tuning area)
; ---------------------------------------------------------------------------
; All implemented automatic effects are enabled at the tested r6 strength and
; timing by default. Changes are loaded when the game starts; restart the game
; after editing this file.
;
; Enabled: 1 = on, 0 = off for that automatic gameplay/menu effect.
; IntensityMultiplier: multiplies the calibrated r4 strength on BOTH native
; DualSense haptics and conventional rumble. Examples: 0.50 = half strength,
; 1.25 = 25% stronger, 2.00 = double. Valid range is 0.00-4.00.
; TriggerOffsetMs: signed delay added to the calibrated event delay. Negative
; values make feedback earlier (never earlier than the detected input/state);
; positive values make it later. Valid range is -5000 to +5000.
; StartTrimOffsetMs: signed playback-position adjustment. Positive values skip
; more of the waveform beginning for a faster impact; negative values restore
; more of its original lead-in. This never changes game or animation speed.
;
; Runtime keys are intentionally limited to F9-F12: F9 previews Dodge, F10
; writes status, F11 toggles the whole mod, and F12 toggles automatic mappings.

[Effect.Walk]
Enabled=1
; Calibrated r4 walk strength is 0.65 before this multiplier.
IntensityMultiplier=1.00
; Native 48 kHz DualSense haptic path only. r7 raises walking to 4.00x the
; original r5 level (100% stronger than r6's 2.00x). Conventional rumble and
; the running texture are unchanged.
DualSenseHapticMultiplier=4.00
; Loop timing follows the captured Shadows gait contacts.
LoopStartMs=2280
LoopEndMs=3810
FadeMs=35

[Effect.Run]
Enabled=1
; Calibrated r4 run strength is 1.50 for five seconds, then 1.25.
IntensityMultiplier=1.00
LoopStartMs=3100
LoopEndMs=4935
OpeningDurationMs=5000
FadeMs=35

[Effect.SprintKick]
Enabled=1
